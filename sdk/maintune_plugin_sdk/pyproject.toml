[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "maintune-plugin-sdk"
version = "2.0.0"
description = "Public SDK for Maintune Plugin API v2"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "mcxianyujun" }]

[tool.setuptools]
packages = ["maintune_plugin_sdk"]
package-dir = { maintune_plugin_sdk = "." }
