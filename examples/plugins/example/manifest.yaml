{
  "id": "example.workflow-notes",
  "name": "Workflow Notes Example",
  "version": "0.1.0-dev",
  "plugin_api": 2,
  "publisher": "mcxianyujun",
  "license": "AGPL-3.0-only",
  "description": "A small, runnable Plugin API v2 example for task lifecycle observations.",
  "maintune": { "min_version": "0.1.0" },
  "runtime": { "default": "isolated", "supported": ["isolated"] },
  "entrypoint": { "python": "workflow_notes" },
  "python": { "dependencies": "requirements.txt" },
  "dependencies": [
    { "id": "example.anysearch", "version": "*", "requirement": "optional" }
  ],
  "ui": { "mode": "bundled", "entrypoint": "ui/index.html" },
  "config_schema": {
    "type": "object",
    "properties": {
      "label": { "type": "string", "title": "Display label", "minLength": 1, "maxLength": 60, "default": "Maintune" },
      "record_started": { "type": "boolean", "title": "Record task starts", "default": true }
    },
    "additionalProperties": false
  }
}
